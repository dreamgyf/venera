name: Validate iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/ios.yml'
      - '.github/workflows/main.yml'
  push:
    branches: [master]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/ios.yml'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: arm64
      - name: Verify iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: flutter pub get
      - run: flutter test
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
