name: Validate iOS

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/ios.yml'
      - '.github/workflows/main.yml'
  push:
    branches: [master]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/ios.yml'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: arm64
      - name: Verify iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: flutter pub get
      - run: flutter test
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package release IPA
        if: github.event_name == 'release'
        run: |
          APP_VERSION=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          test -n "$APP_VERSION"
          PACKAGE_DIR=$(mktemp -d "$RUNNER_TEMP/venera-ios.XXXXXX")
          mkdir -p "$PACKAGE_DIR/Payload" build/ios/release
          cp -R build/ios/iphoneos/Runner.app "$PACKAGE_DIR/Payload/"
          cd "$PACKAGE_DIR"
          zip -qry "$GITHUB_WORKSPACE/build/ios/release/venera-ios-$APP_VERSION.ipa" Payload
      - name: Save release IPA
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/release/*.ipa
          if-no-files-found: error
          compression-level: 0

  publish-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: release
      - name: Attach IPA to published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" release/*.ipa --repo "$REPOSITORY"
