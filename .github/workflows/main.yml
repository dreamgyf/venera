name: Build ALL
run-name: Build ALL
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach missing assets to (blank: build only)'
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  Prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release upload behavior
        run: python3 -m unittest discover -s .github/tests
      - name: Check release target and application source
        id: target
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$RELEASE_TAG" ]; then exit 0; fi
          APP_VERSION=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          test "$RELEASE_TAG" = "v${APP_VERSION%%+*}"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null
          # Recovery may update build recipes, but must retain the tagged app source.
          git diff --exit-code "$RELEASE_TAG" HEAD -- . \
            ':(exclude).github/**' \
            ':(exclude)android/app/build.gradle' \
            ':(exclude)windows/build.py' \
            ':(exclude)doc/release_builds.md'
  Build_MacOS:
    needs: Prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - run: flutter pub get
      - name: Configure macOS signing
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/prepare-macos-signing.sh

      - name: Check rust-toolchain.toml
        run: rustup show

      # Step 2: Build the Flutter macOS app
      - name: Build Flutter macOS App
        run: |
          flutter build macos --release
          codesign --verify --deep --strict --verbose=2 build/macos/Build/Products/Release/venera.app

      # Step 3: Create the DMG file
      - name: Create DMG
        run: |
          mkdir -p dist
          mkdir -p dist/dmg_contents
          cp -R build/macos/Build/Products/Release/venera.app dist/dmg_contents/
          ln -s /Applications dist/dmg_contents/Applications
          hdiutil create -volname "venera" -srcfolder dist/dmg_contents -ov -format UDZO "dist/venera.dmg"

      - name: Add version to filename
        run: |
          APP_VERSION=$(grep "version:" pubspec.yaml | cut -d':' -f2 | tr -d ' ')
          mkdir -p result
          mv dist/venera.dmg "result/venera-$APP_VERSION$MACOS_ARTIFACT_SUFFIX.dmg"

      # Step 4: Attach and upload artifacts (optional)
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos_build
          path: result/
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN"
          fi
  Build_IOS:
    needs: Prepare
    runs-on: xcode-27
    env:
      # iOS 27.1 is required for the full iPhone Duo display area.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: arm64
      - name: Verify iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r venera-ios.ipa Payload
      - name: Add version to filename
        run: |
          APP_VERSION=$(grep "version:" pubspec.yaml | cut -d':' -f2 | tr -d ' ')
          mkdir -p result
          mv build/ios/iphoneos/venera-ios.ipa result/venera-ios-$APP_VERSION.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios_build
          path: result/
  Build_Android:
    needs: Prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf /opt/hostedtoolcache
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - name: Configure Android signing
        env:
          STORE_FILE: ${{ secrets.ANDROID_KEYSTORE }}
          PROPERTY_FILE: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$STORE_FILE" ] && [ -z "$PROPERTY_FILE" ]; then
            echo "No release signing configured; building explicitly named unsigned APKs."
          elif [ -z "$STORE_FILE" ] || [ -z "$PROPERTY_FILE" ]; then
            echo "::error::Both ANDROID_KEYSTORE and ANDROID_KEY_PROPERTIES must be configured together."
            exit 1
          else
            umask 077
            printf '%s' "$STORE_FILE" | base64 --decode > android/keystore.jks
            printf '%s\n' "$PROPERTY_FILE" > android/key.properties
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
      - name: Check rust-toolchain.toml
        run: rustup show
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/app/outputs/apk/release/*.apk
          if-no-files-found: error
  Build_Windows:
    needs: Prepare
    # The current Windows plugins require the Visual Studio 2022 toolchain.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: | 
          choco install yq -y
          pip install httpx
      - name: Install Inno Setup
        run: choco install innosetup --no-progress
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - name: build
        run: |
          flutter pub get
          python windows/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows_build
          path: build/windows/Venera-*
          if-no-files-found: error
  Build_Linux:
    needs: Prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1
          dart pub global activate -s git https://github.com/venera-app/flutter_to_debian.git
      - run: python3 debian/build.py x64
      - run: dart run flutter_to_arch
      - run: |
          sudo rm -rf build/linux/arch/app.tar.gz
          sudo rm -rf build/linux/arch/pkg
          sudo rm -rf build/linux/arch/src
          sudo rm -rf build/linux/arch/PKGBUILD
      - uses: actions/upload-artifact@v4
        with:
          name: deb_build
          path: build/linux/x64/release/debian
      - uses: actions/upload-artifact@v4
        with:
          name: arch_build
          path: build/linux/arch/
  Build_Linux_ARM64:
    needs: Prepare
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          flutter-version-file: pubspec.yaml
      - run: |
          flutter pub get
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1
          dart pub global activate -s git https://github.com/venera-app/flutter_to_debian.git
      - name: "Patch font"
        run: |
          dart run patch/font.dart
      - run: python3 debian/build.py arm64
      - uses: actions/upload-artifact@v4
        with:
          name: deb_arm64_build
          path: build/linux/x64/release/debian # This is a bug related to flutter_to_debian, but it's not a big deal.

  Release:
    runs-on: ubuntu-latest
    needs: [Prepare, Build_MacOS, Build_IOS, Build_Android, Build_Windows, Build_Linux, Build_Linux_ARM64]
    if: ${{ !cancelled() && needs.Prepare.result == 'success' && needs.Prepare.outputs.release_tag != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.Build_MacOS.result == 'success'
        with:
          name: macos_build
          path: outputs
      - uses: actions/download-artifact@v4
        if: needs.Build_Android.result == 'success'
        with:
          name: apks
          path: outputs
      - uses: actions/download-artifact@v4
        if: needs.Build_Windows.result == 'success'
        with:
          name: windows_build
          path: outputs
      - uses: actions/download-artifact@v4
        if: needs.Build_Linux.result == 'success'
        with:
          name: deb_build
          path: outputs
      - uses: actions/download-artifact@v4
        if: needs.Build_Linux.result == 'success'
        with:
          name: arch_build
          path: outputs
      - uses: actions/download-artifact@v4
        if: needs.Build_Linux_ARM64.result == 'success'
        with:
          name: deb_arm64_build
          path: outputs
      # ios.yml publishes the IPA independently. Never overwrite an existing asset.
      - name: Attach missing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.Prepare.outputs.release_tag }}
        run: python3 .github/scripts/upload-release-assets.py
